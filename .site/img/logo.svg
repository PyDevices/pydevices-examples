<polygon points="8.71,8.71 55.29,8.71 47.36,16.64 16.64,16.64" fill="#7293b1"/>
<polygon points="55.29,8.71 55.29,55.29 47.36,47.36 47.36,16.64" fill="#e7edf2"/>
