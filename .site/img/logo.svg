<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PyDevices logo">
  <!--
    The PyDevices mark: a square stone, cut and lit from the top left, with a
    2x4 pin header in its table. Every shape is a filled polygon, so the same
    list draws it on a board with pygraphics. The table is the deep blue
    ground, so the mark is opaque and reads on either theme.
  -->
