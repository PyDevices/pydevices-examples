<!DOCTYPE html>
<html>
    <head>
        <title>Async</title>
        <script src="./mini-coi-fd.js"></script>
    </head>
    <body>
        <canvas id="display_canvas" width="1" height="1" style="background-color: black; border:2px solid black;"></canvas>
        <script type="text/python" id="mpy-script">
            import utils.path
            from board_config import display_drv, app
            from multimer import asyncio

            x, y = 20, 20
            dx, dy = 3, 2
            size = 24
            color = 0x07E0

            async def main():
                global x, y, dx, dy
                w, h = display_drv.width, display_drv.height
                while True:
                    display_drv.fill_rect(x, y, size, size, 0)
                    x += dx
                    y += dy
                    if x <= 0 or x + size >= w:
                        dx = -dx
                    if y <= 0 or y + size >= h:
                        dy = -dy
                    display_drv.fill_rect(x, y, size, size, color)
                    display_drv.show()
                    await asyncio.sleep(0.016)

            app.run_async(main)
        </script>
        <script type="module" src="./wasm-config.js"></script>
    </body>
</html>
