<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Direct MicroPython async</title></head>
<body data-runtime-state="loading">
    <h1>Direct MicroPython async</h1>
    <canvas id="display_canvas" width="320" height="240" hidden></canvas><pre id="log"></pre>
    <script type="module" src="./runtime-host.js"></script>
    <script type="module">
        addEventListener('pydevices-ready', async () => {
            await __pydevicesHost.runSource(`
import asyncio
async def main():
    for value in range(3):
        print('async tick', value)
        await asyncio.sleep_ms(10)
await main()
`);
        }, {once:true});
    </script>
</body>
</html>
