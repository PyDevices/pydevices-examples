<!DOCTYPE html>
<html>

            mip.install("github:PyDevices/pydevices-examples/lib/examples/pydevices_demo.py")

        </script>
        <!-- Visible lesson: edit and press Run. Shares env with setup. -->
        <script type="mpy-editor" env="demo">
            import pydevices_demo
        </script>
        <script type="module" src="./pyscript-config.js"></script>
    </body>
</html>
