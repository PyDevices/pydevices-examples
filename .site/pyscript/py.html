<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./mini-coi-fd.js"></script>
<link rel="stylesheet" href="./vendor/core.css">
<script src="./loader-query.js"></script>
</head>
<style>
/* The org landing page's hero loader, inlined: this shell loads no chrome. */
.canvas-stage{position:relative;display:inline-block;line-height:0}
.hero-canvas-loader{position:absolute;inset:0;background:rgba(8,12,16,.62);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;transition:opacity .3s ease;z-index:2}
body[data-runtime-state="ready"] .hero-canvas-loader{opacity:0;visibility:hidden}
.hero-spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.18);border-top-color:#4fd1c5;border-radius:50%;animation:hero-spin .9s linear infinite}
body[data-runtime-state="failed"] .hero-spinner{animation:none;border-top-color:#e5687a}
@keyframes hero-spin{to{transform:rotate(360deg)}}
.hero-canvas-status{font:600 .72rem/1.4 system-ui;color:rgba(255,255,255,.72);letter-spacing:.05em;text-transform:uppercase;max-width:180px;text-align:center}
</style>
<body bgcolor="black" text="white" link="white" vlink="white" alink="white" data-runtime-state="loading">
<div class="canvas-stage">
<canvas id="display_canvas" width="320" height="480" tabindex="0"></canvas>
<canvas id="aux_canvas" width="1" height="1" tabindex="0"></canvas>
<div class="hero-canvas-loader">
    <div class="hero-spinner"></div>
    <span class="hero-canvas-status" role="status" aria-live="polite">Booting Pyodide…</span>
</div>
</div>
<pre id="log" hidden></pre>
<script>
(function () {
    var Q = window.LoaderQuery;
    var plan = Q.parse(window.location.search);
    if (Q.invalidNames(plan).length) {
        window.__loaderDisabled = true;
        return;
    }
    if (plan.debug) {
        document.getElementById('log').hidden = false;
    }
    Q.publish(plan);
})();
</script>
<script type="py" data-configs="./pyodide.toml https://raw.githubusercontent.com/PyDevices/pydevices/main/pydevices-desktop.toml ./pydevices-examples.toml" output="log">
import builtins
import os
import sys
from js import document

try:
    os.chdir("/")
except OSError:
    pass
if "/" not in sys.path:
    sys.path.insert(0, "/")
import utils.path  # noqa: F401
import ps_loader

def _log_print(*args, **kwargs):
    el = document.getElementById("log")
    if el is not None:
        sep = kwargs.get("sep", " ")
        end = kwargs.get("end", "\n")
        el.textContent += sep.join(str(a) for a in args) + end
        el.scrollTop = el.scrollHeight

builtins.print = _log_print

def _set(msg):
    # Mirrors pyodide.html: one line over the canvas, and the body state the
    # CSS reveals and hides it by.
    if msg:
        _log_print(msg)
    try:
        el = document.querySelector(".hero-canvas-status")
        if el is not None and msg:
            el.textContent = msg
        document.body.dataset.runtimeState = "ready" if not msg else "loading"
    except Exception:
        pass

def _from_window(name, default=""):
    from js import window
    return str(getattr(window, name, default) or default).strip()

async def _run():
    if _from_window("__loaderDisabled"):
        return
    modules = ps_loader.parse_names(_from_window("__loaderModules"))
    manifests = ps_loader.parse_names(_from_window("__loaderManifests"))
    deps = ps_loader.parse_names(_from_window("__loaderDeps"))
    entry = _from_window("__loaderEntry")
    if not entry and modules:
        entry = modules[0]
    elif not entry and manifests:
        entry = manifests[0]
    if not entry:
        print("Missing ?modules= and/or ?manifests= in the URL.")
        return
    _set("Starting…")
    try:
        await ps_loader.install_pyodide(modules, manifests, deps, status=_set)
        _set("Loading " + entry.replace("_", " ") + "…")
        ps_loader.set_board_defaults()
        __import__(entry)
    except Exception:
        _set("Failed to start.")
        document.body.dataset.runtimeState = "failed"
        raise
    _set("")

await _run()
</script>
<script type="module" src="./pyscript-config.js"></script>
</body>
</html>
