# Per-example metadata for tools/example_test_kit.py
# Inventory of all files: packages/examples.json (regenerate via ./scripts/install_refresh_manifests.sh)
#
# kind: oneshot | loop | async | lvgl | pdwidgets | harness | legacy
# quit: native_exit | poll | inject | pending | interactive
# bootstrap: full (default) | headless — headless skips utils.path / display init
# Timer mode for kit runs: host PYDEVICES_TIMER_ASYNC is forwarded as wrapper
# --timer-async (board_config / displaydev.env_set). Examples do not read env.

[defaults]
duration_s = 2
timeout_s = 15
oneshot_timeout_s = 10

# --- v1 curated (high-signal) ---

[examples.pydevices_demo]
import = "pydevices_demo"
script = "examples/pydevices_demo.py"
kind = "async"
quit = "poll"
deps = ["core"]

