<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Direct MicroPython</title>
    <style>
        html,body{margin:0;background:#111;color:#eee;font:14px system-ui;display:grid;place-items:center;height:100%}canvas{max-width:100%;height:auto;image-rendering:pixelated;background:#000;touch-action:none}
        /* The org landing page's hero loader, inlined: this shell loads no site.css. */
        .canvas-stage{position:relative;display:inline-block;line-height:0}
        .hero-canvas-loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;transition:opacity .3s ease;z-index:2}
        body[data-runtime-state="ready"] .hero-canvas-loader{opacity:0;visibility:hidden}
        .hero-spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.18);border-top-color:#4fd1c5;border-radius:50%;animation:hero-spin .9s linear infinite}
        body[data-runtime-state="failed"] .hero-spinner{animation:none;border-top-color:#e5687a}
        @keyframes hero-spin{to{transform:rotate(360deg)}}
        .hero-canvas-status{font:600 .72rem/1.4 system-ui;color:rgba(255,255,255,.72);letter-spacing:.05em;text-transform:uppercase;max-width:180px;text-align:center}
    </style>
</head>
<body data-runtime-state="loading">
    <div class="canvas-stage">
    <canvas id="display_canvas" width="320" height="480" tabindex="0"></canvas>
        <div class="hero-canvas-loader">
            <div class="hero-spinner"></div>
            <span class="hero-canvas-status" role="status" aria-live="polite">Booting MicroPython…</span>
        </div>
    </div>
    <script type="module" src="./gallery-host.js"></script>
</body>
</html>
