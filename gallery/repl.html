<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Direct MicroPython REPL</title>
    <link rel="stylesheet" href="../pyscript/site.css"><link rel="stylesheet" href="../pyscript/demo.css">
</head>
<body data-runtime-state="loading">
    <main class="wrap loader-main">
        <h1>Direct MicroPython REPL</h1>
        <canvas id="display_canvas" width="320" height="240" tabindex="0" hidden></canvas>
        <pre id="log" class="log"></pre>
        <form id="repl"><label for="source"><code>&gt;&gt;&gt;</code></label> <input id="source" autocomplete="off" style="width:80%"></form>
        <button class="btn" id="reset-runtime" type="button">Reset</button>
    </main>
    <script type="module" src="./runtime-host.js"></script>
    <script type="module">
        const form = document.getElementById('repl');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const input = document.getElementById('source');
            document.getElementById('log').textContent += `>>> ${input.value}\n`;
            try { await __pydevicesHost.runSource(input.value); }
            catch (error) { document.getElementById('log').textContent += `${error}\n`; }
            input.value = '';
        });
    </script>
</body>
</html>
