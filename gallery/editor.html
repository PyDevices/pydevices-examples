<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Direct MicroPython Editor</title>
    <link rel="stylesheet" href="../pyscript/site.css"><link rel="stylesheet" href="../pyscript/demo.css">
</head>
<body data-runtime-state="loading">
    <main class="wrap loader-main">
        <h1>Direct MicroPython Editor</h1>
        <div class="actions"><button class="btn" id="run" type="button">Run</button><button class="btn" id="reset-runtime" type="button">Reset</button></div>
        <textarea id="source" style="width:100%;min-height:16rem;font-family:monospace">from displaydev.auto import AutoDisplay

display = AutoDisplay(320, 240)
display.init()
display.fill(0x001f)
display.show()</textarea>
        <canvas id="display_canvas" width="320" height="240" tabindex="0"></canvas>
        <pre id="log" class="log"></pre>
    </main>
    <script type="module" src="./runtime-host.js"></script>
    <script type="module">
        document.getElementById('run').addEventListener('click', async () => {
            try { await __pydevicesHost.runSource(document.getElementById('source').value); }
            catch (error) { document.getElementById('log').textContent += `${error}\n`; }
        });
    </script>
</body>
</html>
